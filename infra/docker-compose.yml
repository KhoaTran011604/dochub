name: hd-document

# Redis không publish port ra host. Postgres chỉ publish ra loopback
# (POSTGRES_HOST_PORT) để chạy migration và nối pgAdmin từ host.

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  # Không giới hạn thì log json-file lớn dần tới khi đầy đĩa.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    # Bản Debian (glibc), không dùng -alpine: musl không có collation theo
    # locale, và đổi libc khi đã có dữ liệu làm hỏng index text.
    image: postgres:16
    ports:
      # Trong container Postgres luôn nghe 5432; chỉ port trên host đổi được.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      # Đọc bởi postgres-init/01-create-databases.sql
      OUTLINE_DB_PASSWORD: ${OUTLINE_DB_PASSWORD:?set OUTLINE_DB_PASSWORD in infra/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in infra/.env}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD:?set BRIDGE_DB_PASSWORD in infra/.env}
      PERMISSION_API_DB_PASSWORD: ${PERMISSION_API_DB_PASSWORD:?set PERMISSION_API_DB_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: server tạm lúc init chỉ nghe unix socket, nên chỉ healthy
      # khi script init đã chạy xong.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis riêng của Outline. App tự viết không dùng chung.
  redis:
    <<: *service-defaults
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  outline:
    <<: *service-defaults
    # Pin tag + digest. Nâng cấp: đổi cả 2, đối chiếu .env.sample của tag mới.
    image: outlinewiki/outline:1.10.1@sha256:832051f039b446c87aa23929cf92c00980c66aaa2d744d118c48c016ec816ad8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Outline kiểm phiên SSO qua bridge (/me) → bridge phải lên trước.
      oidc-bridge:
        condition: service_healthy
    ports:
      # Mặc định chỉ loopback: Outline chạy HTTP, người ngoài phải đi qua
      # reverse proxy có TLS.
      - "${OUTLINE_BIND_ADDRESS:-127.0.0.1}:${OUTLINE_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      URL: ${OUTLINE_URL:?set OUTLINE_URL in infra/.env}
      PORT: "3000"
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?set OUTLINE_SECRET_KEY in infra/.env}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?set OUTLINE_UTILS_SECRET in infra/.env}
      DATABASE_URL: postgres://outline:${OUTLINE_DB_PASSWORD}@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FORCE_HTTPS: ${OUTLINE_FORCE_HTTPS:-false}
      ENABLE_UPDATES: "false"
      # Outline giới hạn số request mỗi phút theo IP (tính cả file tĩnh), quá thì
      # trả 429. Mọi request qua Docker / reverse proxy mang chung 1 IP → nâng
      # lên khi nhiều người dùng chung proxy, hoặc khi chạy E2E liên tiếp.
      RATE_LIMITER_REQUESTS: ${OUTLINE_RATE_LIMITER_REQUESTS:-1000}
      # oidc-bridge là đường đăng nhập duy nhất. AUTH/LOGOUT: trình duyệt gọi
      # (URL public của bridge); TOKEN/USERINFO: container Outline gọi (tên
      # service trong mạng compose). Khai tay, không dùng discovery.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-outline}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in infra/.env}
      OIDC_AUTH_URI: ${OIDC_AUTH_URI:?set OIDC_AUTH_URI in infra/.env}
      OIDC_TOKEN_URI: ${OIDC_TOKEN_URI:-http://oidc-bridge:4001/token}
      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI:-http://oidc-bridge:4001/me}
      OIDC_LOGOUT_URI: ${OIDC_LOGOUT_URI:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-HD ERP}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en_US}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_REPLY_EMAIL: ${SMTP_REPLY_EMAIL:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Client cho permission API (phase 5) chỉ tạo bằng
      # register-outline-oauth-client; tắt đăng ký động.
      OAUTH_DISABLE_DCR: ${OAUTH_DISABLE_DCR:-true}
    volumes:
      - outline-file-storage:/var/lib/outline/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # IdP duy nhất của Outline: SSO 1 click từ ERP + form system_admin.
  # Cần migration đã chạy (bảng bridge.*), xem README.
  oidc-bridge:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/oidc-bridge/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Mặc định chỉ loopback: bridge chạy HTTP, người ngoài đi qua reverse proxy có TLS.
      - "${BRIDGE_BIND_ADDRESS:-127.0.0.1}:${BRIDGE_HOST_PORT:-4001}:4001"
    extra_hosts:
      # Linux: cho container gọi ra host (JWKS của ERP chạy trên máy dev).
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "4001"
      BRIDGE_PUBLIC_URL: ${BRIDGE_PUBLIC_URL:?set BRIDGE_PUBLIC_URL in infra/.env}
      BRIDGE_DATABASE_URL: postgres://bridge_app:${BRIDGE_DB_PASSWORD}@postgres:5432/hd_document_apps
      BRIDGE_COOKIE_KEYS: ${BRIDGE_COOKIE_KEYS:?set BRIDGE_COOKIE_KEYS in infra/.env}
      BRIDGE_SIGNING_JWKS: ${BRIDGE_SIGNING_JWKS:?set BRIDGE_SIGNING_JWKS in infra/.env}
      TRUST_PROXY: ${BRIDGE_TRUST_PROXY:-false}
      OUTLINE_URL: ${OUTLINE_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-outline}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME:?set SYSTEM_ADMIN_USERNAME in infra/.env}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:?set SYSTEM_ADMIN_EMAIL in infra/.env}
      SYSTEM_ADMIN_DISPLAY_NAME: ${SYSTEM_ADMIN_DISPLAY_NAME:-System Admin}
      SYSTEM_ADMIN_PASSWORD_HASH: ${SYSTEM_ADMIN_PASSWORD_HASH:?set SYSTEM_ADMIN_PASSWORD_HASH in infra/.env}
      UPSTREAM_OIDC_ISSUER_URL: ${UPSTREAM_OIDC_ISSUER_URL:-}
      UPSTREAM_OIDC_CLIENT_ID: ${UPSTREAM_OIDC_CLIENT_ID:-}
      UPSTREAM_OIDC_CLIENT_SECRET: ${UPSTREAM_OIDC_CLIENT_SECRET:-}
      UPSTREAM_OIDC_SCOPES: ${UPSTREAM_OIDC_SCOPES:-openid profile email}
      ERP_SSO_ISSUER: ${ERP_SSO_ISSUER:-}
      ERP_SSO_AUDIENCE: ${ERP_SSO_AUDIENCE:-hd-document-sso}
      ERP_SSO_ALGORITHMS: ${ERP_SSO_ALGORITHMS:-ES256}
      ERP_SSO_JWKS_URL: ${ERP_SSO_JWKS_URL:-}
      ERP_SSO_PUBLIC_KEY_PEM: ${ERP_SSO_PUBLIC_KEY_PEM:-}
      SSO_REQUIRE_REFERRER: ${SSO_REQUIRE_REFERRER:-true}
      SSO_ALLOWED_REFERRER_ORIGINS: ${SSO_ALLOWED_REFERRER_ORIGINS:-}
      PERMISSION_API_PUBLIC_URL: ${PERMISSION_API_PUBLIC_URL:-}
      # Tự tạo user ERP ở lần SSO đầu qua permission API (bật khi có SERVICE_KEY).
      PERMISSION_API_INTERNAL_URL: ${PERMISSION_API_INTERNAL_URL:-http://outline-permission-api:4100}
      PERMISSION_API_SERVICE_KEY: ${PERMISSION_API_SERVICE_KEY:-}
      ERP_PORTAL_URL: ${ERP_PORTAL_URL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ERP đẩy user + quyền qua đây bằng service key; service áp ngay vào Outline
  # bằng admin token. Cần migration đã chạy (bảng permission_api.*), xem README.
  outline-permission-api:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/outline-permission-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      outline:
        condition: service_healthy
    ports:
      # Mặc định chỉ loopback: ERP gọi qua mạng nội bộ / reverse proxy có TLS.
      - "${PERMISSION_API_BIND_ADDRESS:-127.0.0.1}:${PERMISSION_API_HOST_PORT:-4100}:4100"
    environment:
      NODE_ENV: production
      PORT: "4100"
      PERMISSION_API_DATABASE_URL: postgres://permission_api_app:${PERMISSION_API_DB_PASSWORD}@postgres:5432/hd_document_apps
      TRUST_PROXY: ${PERMISSION_API_TRUST_PROXY:-false}
      OUTLINE_URL: ${OUTLINE_URL}
      # Gọi Outline API qua tên service trong mạng compose, không qua URL public.
      OUTLINE_INTERNAL_URL: ${OUTLINE_INTERNAL_URL:-http://outline:3000}
      OUTLINE_ADMIN_API_TOKEN: ${OUTLINE_ADMIN_API_TOKEN:?set OUTLINE_ADMIN_API_TOKEN in infra/.env}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL}
      # API tạo node, tác giả là user thật (phase 5). Thiếu 1 biến = tắt nhóm route.
      PERMISSION_API_PUBLIC_URL: ${PERMISSION_API_PUBLIC_URL:-}
      OUTLINE_OAUTH_CLIENT_ID: ${OUTLINE_OAUTH_CLIENT_ID:-}
      OUTLINE_OAUTH_CLIENT_SECRET: ${OUTLINE_OAUTH_CLIENT_SECRET:-}
      OUTLINE_OAUTH_SCOPE: ${OUTLINE_OAUTH_SCOPE:-}
      TOKEN_SEAL_PASSWORD: ${TOKEN_SEAL_PASSWORD:-}
      PENDING_REQUEST_TTL_DAYS: ${PENDING_REQUEST_TTL_DAYS:-}
      ERP_PORTAL_URL: ${ERP_PORTAL_URL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Chạy tay khi stack đang chạy: docker compose run --rm backup
  # Cố ý không depends_on postgres: `run` sẽ dựng lại container postgres nếu
  # stack được up kèm file override, làm rớt kết nối của Outline.
  backup:
    image: postgres:16
    profiles: ["backup"]
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup:/backup:ro
      - ./backup-output:/backup-output
      - outline-file-storage:/outline-file-storage:ro
    entrypoint: ["sh", "-c"]
    # 1 timestamp chung để dump database và file đính kèm nằm cùng thư mục.
    # File COMPLETE chỉ có khi mọi bước xong: thư mục thiếu nó là backup hỏng.
    command:
      - >-
        umask 077
        && export BACKUP_TIMESTAMP=$$(date -u +%Y%m%dT%H%M%SZ)
        && sh /backup/backup-postgres-databases.sh
        && sh /backup/backup-outline-file-storage.sh
        && touch /backup-output/$$BACKUP_TIMESTAMP/COMPLETE
        && echo "Backup complete: /backup-output/$$BACKUP_TIMESTAMP"

volumes:
  postgres-data:
  redis-data:
  outline-file-storage:
